name: Repository validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pin actions to immutable SHAs so a moved version tag cannot change executed code.
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned validation tools
        run: |
          python3 -m pip install --disable-pip-version-check yamllint==1.37.1
          npm install --global markdownlint-cli2@0.18.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        run: make validate
