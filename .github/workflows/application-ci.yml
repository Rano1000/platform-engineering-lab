name: Application supply chain

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARTIFACT_DIR: .artifacts/supply-chain

jobs:
  changes:
    name: Publication decision
    runs-on: ubuntu-24.04
    outputs:
      category: ${{ steps.impact.outputs.category }}
      image_required: ${{ steps.impact.outputs.image_required }}
      chart_required: ${{ steps.impact.outputs.chart_required }}
      chart_changed: ${{ steps.impact.outputs.chart_changed }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect image-impacting changes
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PR_BASE_SHA
          elif [ "$EVENT_NAME" = push ] && ! printf '%s' "$EVENT_BASE_SHA" | grep -Eq '^0{40}$'; then
            base=$EVENT_BASE_SHA
          else
            base=$(git rev-parse HEAD^)
          fi
          ./scripts/detect-image-impact.py --base "$base" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Summarize publication decision
        env:
          CATEGORY: ${{ steps.impact.outputs.category }}
        run: |
          printf '### Change classification\n\nCategory: `%s`\n' "$CATEGORY" >> "$GITHUB_STEP_SUMMARY"

  repository:
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned validation tools
        run: |
          python3 -m pip install --disable-pip-version-check yamllint==1.37.1
          npm install --global markdownlint-cli2@0.18.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate repository and policy
        run: make ci-check

  image:
    name: Test and build once
    if: needs.changes.outputs.image_required == 'true'
    needs: [changes, repository]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      image-reference: ${{ steps.identity.outputs.reference }}
      archive-sha256: ${{ steps.identity.outputs.archive_sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Run unit tests
        run: make app-test
      - name: Build and export immutable image once
        run: make app-image-artifact
      - name: Record image identity
        id: identity
        run: |
          reference="golden-path-api:0.1.0-${GITHUB_SHA::12}"
          archive_sha256=$(cut -d ' ' -f 1 "$ARTIFACT_DIR/golden-path-api.tar.sha256")
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          printf '%s\n\n' '### Immutable image' \
            "Image: \`$reference\`" \
            "OCI revision: \`$GITHUB_SHA\`" \
            "Archive SHA-256: \`$archive_sha256\`" \
            'Unit tests: **passed**' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: golden-path-image-${{ github.sha }}
          path: |
            .artifacts/supply-chain/golden-path-api.tar
            .artifacts/supply-chain/golden-path-api.tar.sha256
          if-no-files-found: error
          retention-days: 14

  chart-promotion:
    name: Open reviewed chart promotion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.chart_required == 'true'
    needs: [changes, repository]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository for chart promotion
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install pinned GitHub CLI
        run: ./scripts/install-pinned-gh.sh .tools >> "$GITHUB_PATH"
      - name: Install pinned manifest parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate chart and open reviewed promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/create-chart-promotion-pr.sh

  supply-chain:
    name: SBOM and vulnerability policy
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Download immutable image archive
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: golden-path-image-${{ github.sha }}
          path: .artifacts/supply-chain
      - name: Verify and load image archive
        run: |
          ./scripts/supply-chain.sh load-artifact
          make app-image-inspect
      - name: Scan repository for secrets
        run: make supply-chain-secret-scan
      - name: Generate CycloneDX SBOM
        run: make app-sbom
      - name: Enforce vulnerability policy
        run: make app-scan
      - name: Add evidence to job summary
        run: |
          python3 - "$ARTIFACT_DIR/sbom-metadata.json" "$ARTIFACT_DIR/scan-summary.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          sbom = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          scan = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          with pathlib.Path(sys.argv[3]).open("a", encoding="utf-8") as summary:
              summary.write("### Supply-chain evidence\n\n")
              summary.write(f"SBOM SHA-256: `{sbom['artifactSha256']}`\n\n")
              summary.write(f"Findings by severity: `{scan['findingsBySeverity']}`\n\n")
              summary.write(f"Findings by fix availability: `{scan['findingsByFixAvailability']}`\n\n")
              summary.write(f"Trivy: `{scan['scanner']['version']}`\n\n")
              summary.write(f"Database updated: `{scan['database'].get('UpdatedAt', 'unavailable')}`\n")
          PY
      - name: Upload SBOM and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: golden-path-supply-chain-${{ github.sha }}
          path: |
            .artifacts/supply-chain/golden-path-api.cdx.json
            .artifacts/supply-chain/golden-path-api.cdx.json.sha256
            .artifacts/supply-chain/sbom-metadata.json
            .artifacts/supply-chain/scan-summary.json
            .artifacts/supply-chain/trivy-metadata.json
            .artifacts/supply-chain/trivy-vulnerabilities.json
            .artifacts/supply-chain/trivy-vulnerabilities.json.sha256
          if-no-files-found: error
          retention-days: 14

  attest-artifacts:
    name: Attest image archive and SBOM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: supply-chain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download image archive
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: golden-path-image-${{ github.sha }}
          path: artifacts
      - name: Download SBOM
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: golden-path-supply-chain-${{ github.sha }}
          path: artifacts
      - name: Attest exact artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            artifacts/golden-path-api.tar
            artifacts/golden-path-api.cdx.json

  publication-gate:
    name: Publication approval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: attest-artifacts
    runs-on: ubuntu-24.04
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Check explicit publication approval
        id: gate
        env:
          APPROVED: ${{ vars.GHCR_PUBLICATION_APPROVED }}
        run: |
          if [ "$APPROVED" = true ]; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
            message='GHCR publication is explicitly approved.'
          else
            echo 'approved=false' >> "$GITHUB_OUTPUT"
            message='Publication not approved'
          fi
          printf '### Publication approval\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified image
    if: needs.publication-gate.outputs.approved == 'true'
    needs: [publication-gate, image, supply-chain]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Download verified artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          pattern: golden-path-*-${{ github.sha }}
          merge-multiple: true
          path: .artifacts/publication
      - name: Install pinned GitHub CLI
        run: ./scripts/install-pinned-gh.sh .tools >> "$GITHUB_PATH"
      - name: Cryptographically verify archive and SBOM
        run: |
          ./scripts/verify-promotion-artifacts.sh artifacts .artifacts/publication gh
          cut -d ' ' -f 1 \
            .artifacts/publication/golden-path-api.tar.sha256 \
            > .artifacts/publication/.attestations-verified
      - name: Publish exact verified archive
        id: publish
        env:
          GHCR_PUBLICATION_APPROVED: ${{ vars.GHCR_PUBLICATION_APPROVED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/publish-image.sh publish .artifacts/publication

  attest-image:
    name: Attest registry image
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Attest exact registry subject
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ needs.publish.outputs.image }}
          subject-digest: ${{ needs.publish.outputs.digest }}

  promote:
    name: Verify and open promotion PR
    needs: [changes, publish, attest-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository for promotion branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Download supply-chain artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          pattern: golden-path-*-${{ github.sha }}
          merge-multiple: true
          path: .artifacts/promotion
      - name: Install pinned GitHub CLI
        run: ./scripts/install-pinned-gh.sh .tools >> "$GITHUB_PATH"
      - name: Install pinned manifest parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify all attestations
        run: |
          ./scripts/verify-promotion-artifacts.sh artifacts .artifacts/promotion gh
          ./scripts/verify-promotion-artifacts.sh image \
            "${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}" gh
      - name: Rescan exact registry digest
        run: |
          ./scripts/supply-chain.sh scan-reference \
            "${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}"
      - name: Confirm public linked package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api /users/Rano1000/packages/container/golden-path-api > .artifacts/promotion/package.json
      - name: Create promotion evidence
        env:
          CHART_CHANGED: ${{ needs.changes.outputs.chart_changed }}
        run: |
          if [ "$CHART_CHANGED" = true ]; then
            chart_revision=$GITHUB_SHA
          else
            chart_revision=$(python3 - <<'PY'
          import json, pathlib, os
          path = pathlib.Path('environments/local/gitops/evidence/golden-path-api.json')
          evidence = json.loads(path.read_text(encoding='utf-8'))
          print(evidence.get('chartRevision', os.environ['GITHUB_SHA']))
          PY
          )
          fi
          ./scripts/create-promotion-evidence.py \
            --chart-revision "$chart_revision" \
            --image-source-revision "$GITHUB_SHA" \
            --image-digest "${{ needs.publish.outputs.digest }}" \
            --archive-checksum .artifacts/promotion/golden-path-api.tar.sha256 \
            --sbom-checksum .artifacts/promotion/golden-path-api.cdx.json.sha256 \
            --vulnerability-report-checksum .artifacts/supply-chain/trivy-vulnerabilities.json.sha256 \
            --scan-summary .artifacts/supply-chain/scan-summary.json \
            --scan-report .artifacts/supply-chain/trivy-vulnerabilities.json \
            --package .artifacts/promotion/package.json \
            --output .artifacts/promotion/promotion-evidence.json
      - name: Open reviewed promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/create-promotion-pr.sh .artifacts/promotion/promotion-evidence.json

  conclusion:
    name: Application CI conclusion
    if: always()
    needs:
      - changes
      - repository
      - image
      - chart-promotion
      - supply-chain
      - attest-artifacts
      - publication-gate
      - publish
      - attest-image
      - promote
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce required conclusions
        env:
          CATEGORY: ${{ needs.changes.outputs.category }}
          IMAGE_REQUIRED: ${{ needs.changes.outputs.image_required }}
          CHART_REQUIRED: ${{ needs.changes.outputs.chart_required }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          SUPPLY_RESULT: ${{ needs.supply-chain.result }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLICATION_APPROVED: ${{ needs.publication-gate.outputs.approved }}
          PROMOTION_RESULT: ${{ needs.promote.result }}
          CHART_PROMOTION_RESULT: ${{ needs.chart-promotion.result }}
        run: |
          [ "$REPOSITORY_RESULT" = success ] || exit 1
          if [ "$IMAGE_REQUIRED" != true ]; then
            echo 'Image publication not required.'
          else
            [ "$IMAGE_RESULT" = success ] && [ "$SUPPLY_RESULT" = success ] || exit 1
            if [ "$EVENT_NAME" = push ] && [ "$PUBLICATION_APPROVED" = true ]; then
              [ "$PROMOTION_RESULT" = success ] || exit 1
            fi
          fi
          if [ "$EVENT_NAME" = push ] && [ "$CHART_REQUIRED" = true ]; then
            [ "$CHART_PROMOTION_RESULT" = success ] || exit 1
          fi
          if [ "$CATEGORY" = desired-state-only ] || [ "$CATEGORY" = unrelated ]; then
            echo 'Promotion not required.'
          fi
