apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "golden-path-api.fullname" . }}
  labels:
    {{- include "golden-path-api.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "golden-path-api.selectorLabels" . | nindent 6 }}
