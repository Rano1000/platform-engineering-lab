apiVersion: v1
kind: LimitRange
metadata:
  name: gitops-defaults
  namespace: gitops
  labels:
    app.kubernetes.io/managed-by: platform-engineering-lab
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 25m, memory: 64Mi}
      default: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitops-budget
  namespace: gitops
  labels:
    app.kubernetes.io/managed-by: platform-engineering-lab
spec:
  hard:
    pods: "8"
    requests.cpu: 750m
    requests.memory: 1536Mi
    limits.cpu: "2"
    limits.memory: 3Gi
