apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: platform-traefik
  labels:
    app.kubernetes.io/managed-by: platform-engineering-lab
    platform.engineering-lab/gateway: platform
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-gateway
    app.kubernetes.io/managed-by: platform-engineering-lab
    platform.engineering-lab/gateway: platform
spec:
  gatewayClassName: platform-traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: platform-apps
